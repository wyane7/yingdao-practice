<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影刀RPA练习 - 课堂练习2：表单自动填写</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 40px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        label .hint {
            color: #bbb;
            font-weight: normal;
            font-size: 12px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus {
            border-color: #4a90d9;
        }
        select {
            cursor: pointer;
            appearance: auto;
            background: #fff;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4a90d9;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .btn-submit:hover {
            background: #3a7bc8;
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            color: #2e7d32;
            font-size: 15px;
            margin-top: 20px;
        }
        .success-message.show {
            display: block;
        }
        .success-message .detail {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
            line-height: 1.8;
            text-align: left;
            padding: 12px;
            background: #fff;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>课堂练习2：表单自动填写</h1>
        <p class="subtitle">
            考核知识点：设置下拉框、设置复选框、填写输入框、数据表达式（字符串拼接）、变量<br>
            任务：用变量存储"城市"和"日期"，用数据表达式拼接后填入备注框，设置下拉框、勾选复选框，点击提交
        </p>

        <form id="practiceForm">
            <div class="form-group">
                <label>备注 <span class="hint">（此处填写：城市 + "·" + 日期 的拼接结果）</span></label>
                <input type="text" id="remark" name="remark" placeholder="例如：杭州·20260807">
            </div>

            <div class="form-group">
                <label>问题类型</label>
                <select id="issueType" name="issueType">
                    <option value="">-- 请选择 --</option>
                    <option value="consult">咨询</option>
                    <option value="complaint">投诉</option>
                    <option value="suggestion">建议</option>
                    <option value="afterSales">售后</option>
                </select>
            </div>

            <div class="form-group">
                <label>优先级</label>
                <select id="priority" name="priority">
                    <option value="">-- 请选择 --</option>
                    <option value="low">低</option>
                    <option value="normal">中</option>
                    <option value="high">高</option>
                    <option value="urgent">紧急</option>
                </select>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="agreeNotify" name="agreeNotify">
                    <label for="agreeNotify">接收处理结果通知</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="agreePrivacy" name="agreePrivacy">
                    <label for="agreePrivacy">同意隐私条款</label>
                </div>
            </div>

            <button type="submit" class="btn-submit">提交</button>
        </form>

        <div class="success-message" id="successMsg">
            ✅ 提交成功！
            <div class="detail" id="successDetail"></div>
        </div>
    </div>

    <script>
        document.getElementById('practiceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var remark = document.getElementById('remark').value;
            var issueType = document.getElementById('issueType');
            var priority = document.getElementById('priority');
            var notify = document.getElementById('agreeNotify').checked;
            var privacy = document.getElementById('agreePrivacy').checked;

            var detail = '备注：' + (remark || '（空）') + '\n';
            detail += '问题类型：' + (issueType.options[issueType.selectedIndex].text || '（未选择）') + '\n';
            detail += '优先级：' + (priority.options[priority.selectedIndex].text || '（未选择）') + '\n';
            detail += '接收通知：' + (notify ? '是' : '否') + '\n';
            detail += '同意隐私条款：' + (privacy ? '是' : '否');

            document.getElementById('successDetail').textContent = detail;
            document.getElementById('successMsg').classList.add('show');
        });
    </script>
</body>
</html>
