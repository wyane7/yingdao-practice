<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影刀RPA初级课程 · 实操练习平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header { text-align: center; max-width: 800px; margin: 0 auto 40px; }
        .header h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 10px; }
        .header p { font-size: 15px; color: #888; line-height: 1.6; }
        .header .badge {
            display: inline-block;
            background: #4a90d9;
            color: #fff;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .cards {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .module-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .module-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .module-card-body { padding: 28px 32px; }
        .module-card-body .module-num {
            font-size: 13px;
            color: #4a90d9;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .module-card-body h2 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }
        .module-card-body p { font-size: 14px; color: #888; line-height: 1.6; }
        .module-card-body .meta {
            margin-top: 12px;
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #aaa;
        }
        .module-card-body .meta span { display: flex; align-items: center; gap: 4px; }
        .arrow { color: #ccc; font-size: 20px; float: right; }
        .placeholder {
            background: #fff;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            max-width: 800px;
            margin: 20px auto 0;
            padding: 24px 32px;
            text-align: center;
            color: #ccc;
            font-size: 14px;
        }
        .footer { text-align: center; margin-top: 40px; color: #ccc; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <span class="badge">影刀初级课程</span>
        <h1>RPA 实操练习平台</h1>
        <p>选择课程模块，进入对应练习页面</p>
    </div>

    <div class="cards">
        <a href="module2-basic-concepts.html" class="module-card">
            <div class="module-card-body">
                <div class="module-num">模块 2</div>
                <h2>基本概念（第6-9节）<span class="arrow">→</span></h2>
                <p>操作类型、变量、数据表达式（字符串拼接 / 数字运算 / 列表）、本章小结</p>
                <div class="meta">
                    <span>📝 课堂练习 2 题</span>
                    <span>📕 课后作业 2 题</span>
                </div>
            </div>
        </a>

        <a href="module3-first-robot.html" class="module-card">
            <div class="module-card-body">
                <div class="module-num">模块 3</div>
                <h2>我的第一个机器人<span class="arrow">→</span></h2>
                <p>批量数据抓取、打印日志的作用、本章小结</p>
                <div class="meta">
                    <span>📝 课堂练习 2 题</span>
                    <span>📕 课后作业 2 题</span>
                </div>
            </div>
        </a>

        <a href="module4-condition.html" class="module-card">
            <div class="module-card-body">
                <div class="module-num">模块 4</div>
                <h2>三大逻辑之条件判断<span class="arrow">→</span></h2>
                <p>条件分支 If/Else、多分支判断、条件表达式、容错处理</p>
                <div class="meta">
                    <span>📝 课堂练习 2 题</span>
                    <span>📕 课后作业 2 题</span>
                </div>
            </div>
        </a>

        <div class="placeholder">
            更多模块即将上线 ...
        </div>
    </div>

    <div class="footer">
        影刀初级课程 · 实操练习平台 · 2026-08
    </div>
</body>
</html>
