    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

            background: #f5f5f5;

        }
        .container {
            max-width: 700px;

        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }

        .staff-list { display: flex; flex-direction: column; gap: 16px; }
        .staff-card {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-left: 4px solid #4a90d9;

            margin-top: 24px;
            padding: 16px 24px;

<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a> / <a href="module4-condition.html">模块4·条件判断</a> / <a href="module4-classroom.html">课堂作业</a> / 课堂练习2
        </div>
        <h1>课堂练习2：员工绩效评级判断</h1>
        <p class="subtitle">
            考核知识点：获取元素信息、条件分支（多分支判断）、数字比较、数据表达式、打印日志<br>
            任务：获取3位员工的姓名和绩效分数，按照评级标准判断每位员工的绩效评级，用打印日志输出结果
        </p>

        <div class="staff-list">
            <div class="staff-card">
                <div class="staff-name">李婷</div>
                <div class="staff-info">
                    <span class="dept">市场部</span>
                    <span class="score-label">本月绩效分：</span><span class="score">92</span>
                </div>
            </div>

            <div class="staff-card">
                <div class="staff-name">王强</div>
                <div class="staff-info">
                    <span class="dept">技术部</span>
                    <span class="score-label">本月绩效分：</span><span class="score">78</span>
                </div>
            </div>

            <div class="staff-card">
                <div class="staff-name">赵敏</div>
                <div class="staff-info">
                    <span class="dept">人事部</span>
                    <span class="score-label">本月绩效分：</span><span class="score">65</span>
                </div>
            </div>
        </div>

        <div class="rating-rule">
            <strong>绩效评级标准：</strong><br>
            90分及以上：优秀　　80 - 89分：良好<br>
            70 - 79分：合格　　70分以下：需改进
        </div>

        <div class="stats">
            练习目标：按评级标准对每位员工做出判断，用打印日志输出「姓名 + 评级 + 分数」，例如：李婷本月绩效评级：优秀（92分）
        </div>
    </div>
</body>
